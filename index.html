<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Broaster del Chef · Inventario</title>
<link rel="icon">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--c:#a8172a;--cd:#6e0d1b;--y:#f5b324;--o:#ef7d1a;--t:#2a1d1d;--bg:#f6f4f3}
*{box-sizing:border-box}body{margin:0;font-family:Poppins,system-ui,sans-serif;background:radial-gradient(circle at 100% 0,#fde3c0 0,transparent 32%),radial-gradient(circle at 0 100%,#f9d0d5 0,transparent 30%),var(--bg);background-attachment:fixed;color:var(--t)}
h2{color:var(--cd);margin:0 0 14px}h3{margin:0 0 10px}
#app,#md{display:none}
#login{min-height:100vh;display:grid;place-items:center;background:linear-gradient(160deg,var(--cd),var(--c))}
#login .card{width:min(360px,92vw);text-align:center}#login img{width:150px;height:150px;border-radius:50%;border:4px solid var(--y)}
nav{position:fixed;inset:0 auto 0 0;width:220px;background:linear-gradient(180deg,var(--cd),var(--c));color:#fff;padding:16px;display:flex;flex-direction:column;gap:4px;z-index:5}
nav img{width:100px;height:100px;border-radius:50%;background:#fff;margin:0 auto 6px;display:block;border:3px solid var(--y)}
.brand{text-align:center;font-weight:700;margin-bottom:12px}
nav button{background:none;border:0;color:#fff;text-align:left;padding:11px 12px;border-radius:10px;font:600 14px Poppins;cursor:pointer}
nav button span{margin-right:8px}nav button:hover{background:#ffffff26}nav button.on{background:#ffffff2e;box-shadow:inset 4px 0 var(--y)}
main{margin-left:220px;padding:24px;max-width:1240px}
.card{background:#fff;border-radius:14px;padding:16px;box-shadow:0 1px 8px #0001}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));margin-bottom:14px}.two{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.kpi{border-top:4px solid var(--y)}.kpi b{display:block;font-size:24px;color:var(--c)}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.bar input{max-width:300px;margin:0}
.btn{background:var(--c);color:#fff;border:0;border-radius:10px;padding:9px 13px;font:600 13px Poppins;cursor:pointer}.btn.y{background:var(--y);color:#3a2300}.btn.alt{background:#ece8e6;color:var(--t)}
input,select{width:100%;padding:9px;border:1px solid #d9d2cf;border-radius:9px;font:14px Poppins;margin:3px 0 9px}label{font-size:12px;font-weight:600}
.tag{padding:2px 9px;border-radius:99px;font-size:11px;font-weight:600;margin-left:4px}
.t-g{background:#d8f2e2;color:#14683a}.t-y{background:#fdeeb8;color:#7a5600}.t-o{background:#ffe0c2;color:#8a4200}.t-r{background:#f9d0d5;color:#8a0f1f}
.img{height:110px;border-radius:10px;background:#f1ecea center/cover;display:grid;place-items:center;font-size:40px;margin-bottom:8px}
.acts{display:flex;gap:5px;flex-wrap:wrap}.acts .btn{padding:6px 9px;font-size:12px}
.warn{background:#fff3cf;margin-bottom:14px}.sc{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:7px;border-bottom:1px solid #eee;text-align:left;white-space:nowrap}th{background:#f6eeee}
.fila{display:flex;gap:6px}.fila input{width:90px}.neg{color:#b3261e}.pos{color:#14683a}
.mesa{cursor:pointer;text-align:center;border-top:6px solid #2e9d5b}.mesa.oc{border-top-color:var(--c);background:#fff1f2}
.semaforo{padding:12px;border-radius:10px;font-weight:700;text-align:center;margin-bottom:10px}
.card{transition:transform .15s}.grid>.card:hover{transform:translateY(-3px)}
.hero{background:linear-gradient(120deg,var(--cd),var(--c) 60%,var(--o));color:#fff;border-radius:18px;padding:18px 22px;display:flex;align-items:center;gap:16px;margin-bottom:16px}.hero img{width:72px;height:72px;border-radius:50%;border:3px solid var(--y);background:#fff}
.big{font-size:34px;letter-spacing:6px;margin-left:auto}#login .big{margin:0}.me{font-size:42px}.ke{font-size:26px;float:right}
.tile{height:130px;border-radius:12px;background-size:cover;background-position:center;display:grid;place-items:center;font-size:64px;position:relative;margin-bottom:8px}.tile .tag{position:absolute;top:8px;right:6px;margin:0;font-style:normal;font-size:11px}.tile .ej{left:6px;right:auto}
.stock{height:7px;background:#eee;border-radius:9px;overflow:hidden;margin:7px 0}.stock i{display:block;height:100%;border-radius:9px}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0}.chip{background:#f6eeee;border-radius:99px;padding:3px 9px;font-size:12px}
.pal{display:flex;flex-wrap:wrap;gap:3px;margin-bottom:9px}.pal span{font-size:24px;cursor:pointer;padding:2px 4px;border-radius:8px}.pal span:hover{background:#f6eeee}
#md{position:fixed;inset:0;background:#0007;z-index:10;align-items:center;justify-content:center;padding:12px}.mbox{width:min(440px,100%);max-height:92vh;overflow:auto}
@media(max-width:800px){nav{inset:auto 0 0 0;width:100%;height:62px;flex-direction:row;padding:5px;overflow-x:auto}nav img,.brand,#who{display:none}nav button{font-size:11px;text-align:center;min-width:68px;padding:5px}nav button span{display:block;margin:0}.hero .big{display:none}main{margin:0;padding:14px 12px 80px}}
</style></head><body>
<div id="login"><div class="card"><img id="lg" alt="Logo"><h2>Broaster del Chef</h2><p class="big">🍗🍟🥤🍔</p><p>Control de inventario</p>
<p>¿Quién eres?</p><div class="bar" style="justify-content:center"><button class="btn" onclick="entrarEmp()">👨‍🍳 Empleado</button><button class="btn y" onclick="quien('admin')">🔑 Administrador</button></div>
<div id="cl" style="display:none"><input id="pw" type="password" placeholder="Escribe la clave" onkeydown="if(event.key=='Enter')entrar()"><button class="btn" onclick="entrar()">Entrar</button></div><p id="er"></p></div></div>
<div id="app"><nav><img id="lg2" alt="Logo"><div class="brand">Broaster del Chef<br><small>Claret</small></div>
<button data-v="panel" onclick="go('panel')"><span>📊</span>Panel</button>
<button data-v="ins" onclick="go('ins')"><span>🥩</span>Insumos</button>
<button data-v="mov" onclick="go('mov')"><span>📒</span>Kardex</button>
<button data-v="rec" onclick="go('rec')"><span>🍗</span>Recetas</button>
<button data-v="mesas" onclick="go('mesas')"><span>🪑</span>Mesas</button>
<button data-v="hist" onclick="go('hist')"><span>📜</span>Historial</button>
<button data-v="rent" onclick="go('rent')"><span>💰</span>Ganancias</button>
<button onclick="sb.auth.signOut().then(()=>location.reload())" style="margin-top:auto"><span>🚪</span>Salir</button><small id="who"></small></nav>

 modal(`<h3>${id?'Editar':'Nuevo'} producto</h3><label>Nombre</label><input id="p_n" value="${p.nombre}"><label>Precio de venta (COP)</label><input id="p_p" type="number" value="${p.precio}"><label>Icono (toca uno; vacío = automático)</label><input id="p_i" value="${p.icono||''}" style="width:90px">${pal('p_i')}<label>Foto (opcional)</label><input id="p_f" type="file" accept="image/*"><h4>Ingredientes por porción</h4><div id="ri"></div><button class="btn alt" onclick="RI.push({i:ins[0]?.id,c:0});filas()">+ Ingrediente</button><br><br><button class="btn" onclick="gProd(${id||0})">Guardar</button> ${id&&ROL=='admin'?`<button class="btn alt" onclick="delProd(${id})">🗑 Eliminar</button>`:''} <button class="btn alt" onclick="cerrar()">Cancelar</button>`);filas()}
function filas(){$('#ri').innerHTML=RI.map((r,k)=>`<div class="fila"><select onchange="RI[${k}].i=+this.value">${ins.map(i=>`<option value="${i.id}" ${i.id==r.i?'selected':''}>${i.nombre} (${i.unidad})</option>`).join('')}</select><input type="number" step="any" value="${r.c}" onchange="RI[${k}].c=+this.value"><button class="btn alt" onclick="RI.splice(${k},1);filas()">✕</button></div>`).join('')}
async function gProd(id){const o={nombre:$('#p_n').value.trim(),precio:+$('#p_p').value||0,icono:$('#p_i').value.trim()||null};if(!o.nombre)return alert('Escribe el nombre');const fl=$('#p_f').files[0];if(fl){try{o.imagen=await subir(fl)}catch(x){return alert(x.message)}}let e;
 if(id){({error:e}=await sb.from('productos').update(o).eq('id',id))}else{const r=await sb.from('productos').insert(o).select().single();e=r.error;id=r.data?.id}
 if(e)return alert(e.message);await sb.from('receta_items').delete().eq('producto_id',id);const it=RI.filter(r=>r.i&&r.c>0).map(r=>({producto_id:id,insumo_id:r.i,cantidad:r.c}));if(it.length)await sb.from('receta_items').insert(it);cerrar();go(vista)}
async function delProd(id){if(!confirm('¿Eliminar este producto y su receta?'))return;await sb.from('productos').delete().eq('id',id);cerrar();go(vista)}

function vRent(){const m=ym(new Date()),S=t=>mov.filter(x=>x.tipo==t&&ym(x.fecha)==m).reduce((s,x)=>s+x.total,0);R={ing:ven.filter(x=>ym(x.fecha)==m).reduce((s,x)=>s+x.total,0),cons:S('salida'),mer:S('merma')};
 $('#main').innerHTML=`<h2>¿Estoy ganando o perdiendo?</h2><div class="grid two"><div class="card"><h3>Parámetros (puedes cambiarlos)</h3><label>Gastos fijos al mes (arriendo, servicios, salarios…)</label><input id="r_g" type="number" value="${cfg.gastos_fijos||0}" oninput="calc()"><label>Meta de margen bruto (%)</label><input id="r_m" type="number" value="${cfg.margen_meta||60}" oninput="calc()"><label>¿Y si los ingredientes suben (%)? Solo para simular</label><input id="r_a" type="number" value="0" oninput="calc()">${ROL=='admin'?'<button class="btn" onclick="gCfg()">Guardar parámetros</button>':''}</div><div class="card" id="rr"></div></div>`;calc()}
function calc(){const {ing,cons,mer}=R,g=+$('#r_g').value||0,meta=+$('#r_m').value||0,a=1+(+$('#r_a').value||0)/100,bruta=ing-(cons+mer)*a,mb=ing?bruta/ing*100:0,neta=bruta-g,col=!ing?'y':neta<0?'r':mb<meta?'y':'g',pe=mb>0?g/(mb/100):0;
 $('#rr').innerHTML=`<h3>Este mes</h3><div class="semaforo t-${col}">${{g:'Vas ganando 👍',y:ing?'Cuidado: el margen está por debajo de tu meta':'Aún no hay ventas registradas este mes',r:'Estás perdiendo dinero ⚠️'}[col]}</div><p>Ventas registradas: <b>${cop(ing)}</b><br>Ingredientes consumidos: <b>${cop(cons*a)}</b><br>Mermas: <b>${cop(mer*a)}</b><br>Ganancia bruta: <b>${cop(bruta)}</b> (${nf(mb)}%)<br>Gastos fijos: <b>${cop(g)}</b><br>Resultado estimado: <b>${cop(neta)}</b></p>${pe?`<p>Para no perder necesitas vender cerca de <b>${cop(pe)}</b> al mes (${cop(pe/26)} por día).</p>`:''}<small>Es un estimado: si faltan gastos en “gastos fijos”, el resultado real será menor.</small>`}
async function gCfg(){const {error}=await sb.from('config').update({gastos_fijos:+$('#r_g').value||0,margen_meta:+$('#r_m').value||60}).eq('id',1);alert(error?error.message:'Guardado ✅')}

const rango=f=>{const d=new Date(f),n=new Date();return HP=='todo'||(HP=='hoy'&&d.toDateString()==n.toDateString())||(HP=='mes'&&ym(d)==ym(n))||(HP=='semana'&&n-d<7*864e5)},fh=f=>new Date(f).toLocaleString('es-CO'),
vv=()=>ven.filter(x=>rango(x.fecha)).map(x=>({Fecha:fh(x.fecha),Producto:x.nombre||prods.find(p=>p.id==x.producto_id)?.nombre||'—',Cantidad:x.cantidad,'Precio unit.':Math.round(x.precio??(x.cantidad?x.total/x.cantidad:0)),Total:x.total,Mesa:x.mesa||'—',Pago:x.pago||'—'})),
cc=()=>comp.filter(x=>rango(x.fecha)).map(x=>({Fecha:fh(x.fecha),Insumo:x.insumos?.nombre||'—',Cantidad:x.cantidad,'Costo unit.':x.costo,Total:x.total,'Proveedor / factura':x.motivo||'—',Usuario:x.usuario||'—'})),
fm=(k,v)=>/precio|total|costo/i.test(k)?cop(v):k=='Cantidad'?nf(v):v;
let HID=[];
function vHist(){const V=HT=='ventas',RAW=V?ven.filter(x=>rango(x.fecha)):comp.filter(x=>rango(x.fecha)),rows=V?vv():cc(),tot=rows.reduce((s,r)=>s+r.Total,0),adm=ROL=='admin';HID=RAW.map(x=>x.id);
 $('#main').innerHTML=`<h2>Historial</h2><div class="bar"><button class="btn ${V?'':'alt'}" onclick="HT='ventas';vHist()">🛒 Ventas</button><button class="btn ${V?'alt':''}" onclick="HT='compras';vHist()">📥 Compras</button><select onchange="HP=this.value;vHist()" style="width:auto;margin:0">${[['hoy','Hoy'],['semana','Últimos 7 días'],['mes','Este mes'],['todo','Todo']].map(o=>`<option value="${o[0]}" ${o[0]==HP?'selected':''}>${o[1]}</option>`).join('')}</select><button class="btn alt" onclick="csv(HT,HT=='ventas'?vv():cc())">⬇ Excel</button>${adm&&rows.length?'<button class="btn alt" onclick="delH(HID,1)">🗑️ Borrar lo que se ve</button>':''}</div><div class="card kpi" style="margin-bottom:14px">${rows.length} ${V?'ventas · Total vendido':'compras · Total comprado'}<b>${cop(tot)}</b></div>${rows.length?`<div class="card sc"><table><tr>${Object.keys(rows[0]).map(k=>'<th>'+k+'</th>').join('')}${adm?'<th></th>':''}</tr>${rows.map((r,k)=>'<tr>'+Object.keys(r).map(c=>'<td>'+fm(c,r[c])+'</td>').join('')+(adm?'<td><button class="btn alt" onclick="delH(['+RAW[k].id+'])">🗑</button></td>':'')+'</tr>').join('')}</table></div>`:'<p>No hay registros en este período.</p>'}`}
async function delH(ids,todo){const n=HT=='ventas'?'ventas':'compras';if(todo?prompt('Vas a borrar '+ids.length+' registro(s) de '+n+' del período que estás viendo. Las existencias del inventario NO cambian.\n\nEscribe BORRAR para continuar:')!=='BORRAR':!confirm('¿Borrar este registro del historial? Las existencias del inventario NO cambian.'))return;
 const {error}=await sb.rpc(HT=='ventas'?'borrar_ventas':'borrar_compras',{p_ids:ids});error?alert(error.message):go('hist')}
const pedDe=m=>abiertos.find(p=>p.mesa_id==m.id),itDe=p=>p?items.filter(i=>i.pedido_id==p.id):[],totalP=its=>its.reduce((s,i)=>s+i.precio*i.cantidad,0);
function vMesas(){$('#main').innerHTML='<h2>Mesas y barras</h2><div class="bar">'+(ROL=='admin'?'<button class="btn alt" onclick="fMesas()">✏️ Editar nombres</button>':'')+'<button class="btn alt" onclick="go(\'mesas\')">🔄 Actualizar</button></div><div class="grid">'+(mesas.map(m=>{const it=itDe(pedDe(m));return `<div class="card mesa ${it.length?'oc':''}" onclick="abrirMesa(${m.id})"><div class="me">${/barra/i.test((m.zona||'')+m.nombre)?'🍹':'🪑'}</div><b>${m.nombre}</b><br><small>${m.zona||''}</small><p>${it.length?it.length+' producto(s) · <b>'+cop(totalP(it))+'</b>':'Libre'}</p></div>`}).join('')||'<p>No hay mesas. El administrador las agrega en “Editar nombres”.</p>')+'</div>'}
const refrescar=async id=>{await cargar();vMesas();id?abrirMesa(id):cerrar()};
function abrirMesa(id){const m=mesas.find(x=>x.id==id),p=pedDe(m),it=itDe(p);
 modal(`<h3>${m.nombre}</h3><small>${m.zona||''}</small>${it.length?'<table>'+it.map(i=>`<tr><td>${nf(i.cantidad)} × ${i.nombre}${i.nota?'<br><small>📝 '+i.nota+'</small>':''}</td><td>${cop(i.precio*i.cantidad)}</td><td><button class="btn alt" onclick="quitar(${i.id},${id})">✕</button></td></tr>`).join('')+`</table><p><b>Total: ${cop(totalP(it))}</b></p>`:'<p>Esta mesa no tiene pedido.</p>'}<h4>Agregar al pedido</h4><select id="a_p">${prods.map(x=>`<option value="${x.id}">${ico(x)} ${x.nombre} — ${cop(x.precio)}</option>`).join('')}</select><input id="a_c" type="number" min="1" value="1"><input id="a_n" placeholder="Nota (ej: sin lechuga)" style="width:100%"><button class="btn y" onclick="agregar(${id})">+ Agregar</button>${it.length?`<hr><label>Forma de pago</label><select id="a_pg"><option>Efectivo</option><option>Transferencia</option><option>Tarjeta</option></select><button class="btn" onclick="cobrar(${p.id})">💵 Cobrar y liberar mesa</button> <button class="btn alt" onclick="anular(${p.id})">Cancelar pedido</button><br><br>`:' '}<button class="btn alt" onclick="cerrar();go('mesas')">Cerrar</button>`)}
async function agregar(id){const pr=prods.find(x=>x.id==$('#a_p').value),c=+$('#a_c').value;if(!pr||!(c>0))return alert('Elige un producto y una cantidad');let p=pedDe(mesas.find(x=>x.id==id));
 if(!p){const r=await sb.from('pedidos').insert({mesa_id:id}).select().single();if(r.error)return alert(r.error.message);p=r.data}
 const {error}=await sb.from('pedido_items').insert({pedido_id:p.id,producto_id:pr.id,nombre:pr.nombre,precio:pr.precio,cantidad:c,nota:$('#a_n').value});error?alert(error.message):refrescar(id)}
async function quitar(i,id){const {error}=await sb.from('pedido_items').delete().eq('id',i);error?alert(error.message):refrescar(id)}
async function cobrar(pid){const {error}=await sb.rpc('cobrar',{p_pedido:pid,p_pago:$('#a_pg').value});error?alert(error.message):(cerrar(),go('mesas'))}
async function anular(pid){if(!confirm('¿Cancelar este pedido? No se cobra ni se descuenta inventario.'))return;const {error}=await sb.from('pedidos').delete().eq('id',pid);error?alert(error.message):(cerrar(),go('mesas'))}
function fMesas(){modal(`<h3>Mesas y barras</h3>${mesas.map(m=>`<div class="fila"><input id="mn${m.id}" value="${m.nombre}" style="width:130px"><input id="mz${m.id}" value="${m.zona||''}" placeholder="Zona" style="width:110px"><button class="btn alt" onclick="delMesa(${m.id})">🗑</button></div>`).join('')}<h4>Agregar nueva</h4><div class="fila"><input id="mn0" placeholder="Ej: Barra 3" style="width:130px"><input id="mz0" placeholder="Zona" style="width:110px"></div><br><button class="btn" onclick="gMesas()">Guardar</button> <button class="btn alt" onclick="cerrar()">Cancelar</button>`)}
async function gMesas(){for(const m of mesas){const n=$('#mn'+m.id).value.trim();if(n)await sb.from('mesas').update({nombre:n,zona:$('#mz'+m.id).value}).eq('id',m.id)}const n=$('#mn0').value.trim();if(n)await sb.from('mesas').insert({nombre:n,zona:$('#mz0').value,orden:mesas.length+1});cerrar();go('mesas')}
async function delMesa(id){if(!confirm('¿Eliminar esta mesa?'))return;const {error}=await sb.from('mesas').delete().eq('id',id);error?alert(error.message):(cerrar(),go('mesas'))}
setInterval(()=>{if(ROL&&vista=='mesas'&&$('#md').style.display!='flex')cargar().then(()=>{if(vista=='mesas'&&$('#md').style.display!='flex')vMesas()})},15000);

$('#lg').src=$('#lg2').src=LOGO;$('link[rel=icon]').href=LOGO;if(!sb)$('#er').textContent='Falta pegar la URL y la clave de Supabase en index.html';inicio();
</script></body></html>
